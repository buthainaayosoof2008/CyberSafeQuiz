{% extends "base.html" %}

{% block title %}Edit Question - CyberSafe Quiz{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Cybersecurity Question</h1>

        <p>
            Update the selected quiz question.
        </p>
    </div>

    <a
        href="{{ url_for('questions') }}"
        class="btn btn-secondary"
    >
        ← Back to Questions
    </a>

</div>


<div class="form-card">

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >


        <div class="form-group">

            <label for="question">
                Question
            </label>

            <textarea
                id="question"
                name="question"
                rows="4"
                maxlength="1000"
                required
            >{{ question.question }}</textarea>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="option_a">
                    Option A
                </label>

                <input
                    type="text"
                    id="option_a"
                    name="option_a"
                    value="{{ question.option_a }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="option_b">
                    Option B
                </label>

                <input
                    type="text"
                    id="option_b"
                    name="option_b"
                    value="{{ question.option_b }}"
                    required
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="option_c">
                    Option C
                </label>

                <input
                    type="text"
                    id="option_c"
                    name="option_c"
                    value="{{ question.option_c }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="option_d">
                    Option D
                </label>

                <input
                    type="text"
                    id="option_d"
                    name="option_d"
                    value="{{ question.option_d }}"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="correct_answer">
                Correct Answer
            </label>

            <select
                id="correct_answer"
                name="correct_answer"
                required
            >

                <option
                    value="A"
                    {% if question.correct_answer == "A" %}
                    selected
                    {% endif %}
                >
                    A
                </option>

                <option
                    value="B"
                    {% if question.correct_answer == "B" %}
                    selected
                    {% endif %}
                >
                    B
                </option>

                <option
                    value="C"
                    {% if question.correct_answer == "C" %}
                    selected
                    {% endif %}
                >
                    C
                </option>

                <option
                    value="D"
                    {% if question.correct_answer == "D" %}
                    selected
                    {% endif %}
                >
                    D
                </option>

            </select>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('questions') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Update Question
            </button>

        </div>

    </form>

</div>

{% endblock %}
