{% extends "base.html" %}

{% block title %}Add Question - CyberSafe Quiz{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Add Cybersecurity Question</h1>

        <p>
            Create a new question for the quiz.
        </p>
    </div>

    <a
        href="{{ url_for('questions') }}"
        class="btn btn-secondary"
    >
        ← Back to Questions
    </a>

</div>


<div class="form-card">

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >


        <div class="form-group">

            <label for="question">
                Question
            </label>

            <textarea
                id="question"
                name="question"
                rows="4"
                maxlength="1000"
                placeholder="Enter the cybersecurity question"
                required
            ></textarea>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="option_a">
                    Option A
                </label>

                <input
                    type="text"
                    id="option_a"
                    name="option_a"
                    placeholder="Enter option A"
                    required
                >

            </div>


            <div class="form-group">

                <label for="option_b">
                    Option B
                </label>

                <input
                    type="text"
                    id="option_b"
                    name="option_b"
                    placeholder="Enter option B"
                    required
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="option_c">
                    Option C
                </label>

                <input
                    type="text"
                    id="option_c"
                    name="option_c"
                    placeholder="Enter option C"
                    required
                >

            </div>


            <div class="form-group">

                <label for="option_d">
                    Option D
                </label>

                <input
                    type="text"
                    id="option_d"
                    name="option_d"
                    placeholder="Enter option D"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="correct_answer">
                Correct Answer
            </label>

            <select
                id="correct_answer"
                name="correct_answer"
                required
            >

                <option value="">
                    Select the correct answer
                </option>

                <option value="A">
                    A
                </option>

                <option value="B">
                    B
                </option>

                <option value="C">
                    C
                </option>

                <option value="D">
                    D
                </option>

            </select>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('questions') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Question
            </button>

        </div>

    </form>

</div>

{% endblock %}
