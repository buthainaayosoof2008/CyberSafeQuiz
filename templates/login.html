{% extends "base.html" %}

{% block title %}Login - CyberSafe Quiz{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🛡️
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to CyberSafe Quiz
        </p>

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-full"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>

    </div>

</div>

{% endblock %}
